<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anarchy</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--ink:#e5e5e5;--mute:#8a8a8a;--line:#222222;--soft:#141414;--soft2:#1a1a1a;--blue:#ff2d2d;--link:#ff4d4d;--red:#ff2d2d;--g:linear-gradient(45deg,#ff2d2d,#8b0000);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{scrollbar-color:var(--soft2) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .15s var(--ease),background .2s,opacity .2s}
button:active{transform:scale(.95)}
input,textarea{width:100%;padding:.65rem .85rem;border:1px solid var(--line);border-radius:10px;background:var(--soft);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,95,255,.25)}
textarea{resize:vertical;min-height:70px;margin:.5rem 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bl,.gh{border-radius:10px;padding:.5rem 1rem;font-weight:700;white-space:nowrap}
.bl{background:var(--blue);color:#fff}.bl:hover{filter:brightness(1.12)}
.gh{background:var(--soft)}.gh:hover{background:var(--soft2)}
.lnk{color:var(--link);font-weight:700;font-size:.85rem}.lnk:hover{color:#fff}.lnk.off{color:var(--mute)}
.hide{display:none!important}small{color:var(--mute)}.err{color:#ff5c6a;min-height:1.2em}
.empty{color:var(--mute);text-align:center;padding:2rem 0}
.row{display:flex;gap:.5rem;align-items:center}
.av{border-radius:50%;object-fit:cover;background:var(--soft);display:inline-grid;place-items:center;font-weight:700;flex:none}
.vf{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;margin-left:4px;vertical-align:middle}
.ic{display:block;flex:none}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}.ib:hover{background:var(--soft)}

/* ---------- animações ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:none}}
@keyframes zoomOut{to{opacity:0;transform:scale(.92)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(-40px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes popMenu{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes heart{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes ping{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#view.fx{animation:rise .38s var(--ease)}
.stg>*{animation:rise .45s var(--ease) both;animation-delay:calc(min(var(--i,0),14)*45ms)}
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:10px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

/* ---------- login ---------- */
#auth{max-width:350px;margin:7vh auto;padding:2rem 1.5rem;text-align:center;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.015);animation:zoomIn .5s var(--ease)}
#auth img{width:110px;border-radius:24%;animation:float 4s ease-in-out infinite}
#auth h1{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;margin:.4rem 0 1rem;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#auth input{margin-bottom:.6rem}#auth .row button{flex:1}

/* ---------- barra lateral ---------- */
#side{position:fixed;left:0;top:0;bottom:0;width:72px;border-right:1px solid var(--line);padding:.8rem .65rem;display:flex;flex-direction:column;gap:.15rem;background:var(--bg);z-index:30;overflow:hidden;transition:width .28s var(--ease),box-shadow .28s}
#side:hover{width:244px;box-shadow:12px 0 40px rgba(0,0,0,.45)}
body.pn #side:hover{width:72px;box-shadow:none}
.lw{display:flex;align-items:center;gap:.8rem;padding:.35rem .35rem 1.2rem;width:100%;text-align:left}
.lw img{width:34px;height:34px;border-radius:24%;flex:none}
.lt{font-weight:800;font-size:1.2rem;letter-spacing:-.03em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.nv{display:flex;gap:1rem;align-items:center;padding:.8rem .75rem;border-radius:12px;font-size:1rem;width:100%;text-align:left;white-space:nowrap;position:relative}
.nv:hover{background:var(--soft)}.nv.on{font-weight:800}.nv.on .ic{stroke-width:2.6}
.nv:hover .ii{transform:scale(1.1)}.ii{position:relative;display:grid;transition:transform .2s var(--ease)}
.nv>span,.lt{opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .25s var(--ease)}
#side:hover .nv>span,#side:hover .lt{opacity:1;transform:none}
body.pn #side:hover .nv>span,body.pn #side:hover .lt{opacity:0;transform:translateX(-8px)}
.sp{margin-top:auto}
.bd{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);animation:ping .35s var(--ease)}
main{margin-left:72px}
#view{min-height:100vh}
@media(max-width:760px){
  #side,#side:hover{top:auto;width:auto;right:0;flex-direction:row;border:0;border-top:1px solid var(--line);padding:.2rem .4rem;justify-content:space-around;box-shadow:none;height:56px}
  .nv>span,.lt,.lw,.sp{display:none}.nv{justify-content:center;width:auto;padding:.7rem}main{margin-left:0;padding-bottom:60px}
  #side .nv[data-more]{display:none}
}

/* ---------- painéis (notificações / pesquisa) ---------- */
#panel{position:fixed;left:72px;top:0;bottom:0;width:397px;max-width:calc(100vw - 72px);background:var(--bg);border-right:1px solid var(--line);border-radius:0 18px 18px 0;z-index:25;overflow-y:auto;padding:1.4rem 0 1rem;box-shadow:10px 0 40px rgba(0,0,0,.4);animation:slideIn .32s var(--ease)}
#panel.out{animation:slideOut .22s ease forwards}
#panel h2{margin:0 1.4rem 1rem;font-size:1.5rem;font-weight:800}
#panel h4{margin:1rem 1.4rem .4rem;font-size:1rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:0 1.4rem .6rem;scrollbar-width:none}
.chip{border:1px solid var(--line);border-radius:20px;padding:.35rem .9rem;white-space:nowrap;font-weight:600;font-size:.85rem}
.chip.on{background:var(--soft2);border-color:var(--soft2)}.chip:hover{background:var(--soft)}
.nt{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.4rem;cursor:pointer;transition:background .2s}
.nt:hover{background:rgba(255,255,255,.04)}.nt.new{background:rgba(76,95,255,.1)}
.nt .tx{flex:1;line-height:1.3}.nt .tx small{white-space:nowrap}
.nt .th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none}
.sres{padding:0 .6rem}
@media(max-width:760px){#panel{left:0;right:0;bottom:56px;width:auto;max-width:none;border-radius:0;animation-name:slideUp}}

/* ---------- menu "Mais" ---------- */
#more{position:fixed;left:12px;bottom:64px;width:262px;background:var(--soft);border-radius:16px;padding:.5rem;z-index:40;box-shadow:0 8px 40px rgba(0,0,0,.6);transform-origin:bottom left;animation:popMenu .22s var(--ease)}
#more.out{animation:zoomOut .15s ease forwards}
#more button{display:flex;gap:.8rem;align-items:center;width:100%;padding:.8rem;border-radius:10px;text-align:left}
#more button:hover{background:var(--soft2)}

/* ---------- início ---------- */
.home{display:flex;justify-content:center;gap:4rem;padding:1.4rem 1rem 5rem}
.hc{width:min(630px,100%);min-width:0}
.rc{width:320px;flex:none;position:sticky;top:1.4rem;align-self:flex-start}
@media(max-width:1180px){.rc{display:none}}
.stories{display:flex;gap:.9rem;overflow-x:auto;padding:0 0 1.2rem;scrollbar-width:none;max-width:470px;margin:0 auto}
.st{display:grid;justify-items:center;gap:.3rem;width:78px;flex:none}.st small{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:.78rem}
.st:hover .ring{transform:scale(1.06)}
.ring{padding:3px;border-radius:50%;background:var(--g);display:grid;transition:transform .2s var(--ease)}.ring.seen{background:var(--line)}.ring .av{border:3px solid var(--bg)}
.post{margin:0 auto 1.4rem;padding-bottom:.8rem;width:min(470px,100%);border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:.6rem;padding:.55rem 0}
.ph b,.ph a{cursor:pointer}.ph .who{flex:1;min-width:0}.ph .who small{margin-left:2px}
.mo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}.mo:hover{background:var(--soft)}
.pm{position:relative;border-radius:6px;overflow:hidden;background:#000}
.pm img,.pm video{width:100%;display:block;max-height:640px;object-fit:cover}
.mute{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;z-index:2}
.bh{position:absolute;left:50%;top:50%;color:#fff;pointer-events:none;animation:burst .8s var(--ease) forwards;filter:drop-shadow(0 4px 16px rgba(0,0,0,.5));z-index:3}
.pa{display:flex;gap:1.1rem;align-items:center;padding:.6rem 0 .3rem}
.ab{display:inline-flex;align-items:center;gap:.4rem;font-weight:600}.ab:hover{opacity:.7}
.ab.lk.on svg{fill:var(--red);stroke:var(--red)}.ab.lk.pop svg{animation:heart .45s var(--ease)}
.pb p{margin:.2rem 0}.pb .pl{font-weight:700}.pb input{border:0;background:none;padding:.5rem 0;box-shadow:none}
.pb .more{color:var(--mute);cursor:pointer;display:inline-block;margin:.1rem 0}
.tg a{color:var(--link);cursor:pointer;margin-right:.35rem}
.ro{color:var(--mute);font-size:.8rem}
.acc{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}.acc>span:not(.av){flex:1;display:grid;line-height:1.2;min-width:0}
.sg{display:flex;align-items:center;gap:.8rem;padding:.45rem 0;animation:rise .4s var(--ease) both}.sg>span:not(.av){flex:1;display:grid;line-height:1.25;min-width:0}.sg>span:not(.av) *{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg b,.acc b{cursor:pointer}
.foot{margin-top:1.6rem;color:#5d6572;font-size:.75rem;line-height:1.7}

/* ---------- reels ---------- */
.reels{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;display:flex;flex-direction:column;align-items:center}
.reel{position:relative;flex:none;height:100vh;width:min(430px,100%);scroll-snap-align:start;padding:14px 0;display:flex}
.reel video{width:100%;height:100%;object-fit:cover;border-radius:14px;background:#000;cursor:pointer}
.reel .mute{top:28px;right:14px;bottom:auto}
.ra{position:absolute;right:-64px;bottom:20px;display:flex;flex-direction:column;gap:1.1rem;align-items:center}
.ra .ab{flex-direction:column;gap:.15rem;font-size:.8rem}
.ri{position:absolute;left:0;right:0;bottom:14px;padding:3rem 1rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.75));border-radius:0 0 14px 14px;color:#fff;pointer-events:none}
.ri *{pointer-events:auto}.ri p{margin:.4rem 0 0}.ri b{cursor:pointer}
@media(max-width:560px){.reel{padding:0}.reel video,.ri{border-radius:0}.ra{right:10px;bottom:90px;color:#fff;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}.reels,.reel{height:calc(100vh - 56px)}}
@media(max-width:760px){.reels,.reel{height:calc(100vh - 56px)}}

/* ---------- perfil ---------- */
.prof{max-width:935px;margin:0 auto;padding:2rem 1rem 5rem}
.pt{display:flex;gap:4rem;align-items:flex-start;padding:0 1rem}
.pt .pav{flex:none}.pt .pi{display:grid;gap:.9rem;min-width:0;flex:1}
.pt h2{margin:0;font-size:1.25rem}.cnt{display:flex;gap:2rem}
.bio{line-height:1.45}.bio p{margin:.15rem 0;white-space:pre-wrap}
.pbt{display:flex;gap:.5rem;margin:1.4rem 0 0}.pbt button{flex:1;padding:.7rem;border-radius:10px}
.hl{display:flex;gap:1.4rem;padding:1.6rem 1rem 1.2rem}.hl button{display:grid;justify-items:center;gap:.4rem;font-weight:600;font-size:.8rem}
.hl .nw{width:86px;height:86px;border-radius:50%;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;color:var(--mute);transition:transform .2s var(--ease),border-color .2s}.hl button:hover .nw{transform:scale(1.06);border-color:var(--mute)}
.tabs{position:relative;display:flex;justify-content:center;border-top:1px solid var(--line);margin-top:.6rem}
.tab{display:flex;align-items:center;gap:.5rem;padding:1rem 1.6rem;color:var(--mute);font-weight:700;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase}
.tab:hover{color:var(--ink)}.tab.on{color:var(--ink)}
.ink{position:absolute;top:-1px;height:2px;background:var(--ink);width:0;transition:left .35s var(--ease),width .35s var(--ease)}
.tc{min-height:260px;padding-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gi{position:relative;aspect-ratio:1;cursor:pointer;background:var(--soft);overflow:hidden}
.gi.tall{aspect-ratio:9/14}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.gi:hover img,.gi:hover video{transform:scale(1.06)}
.gi>i{position:absolute;top:8px;right:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.gi .ov2{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;gap:1.2rem;align-items:center;justify-content:center;font-weight:700;color:#fff;opacity:0;transition:opacity .2s}
.gi:hover .ov2{opacity:1}.gi .ov2 span{display:flex;gap:.35rem;align-items:center}
.eg{text-align:center;padding:3.5rem 1rem 2rem;display:grid;justify-items:center;gap:.7rem;animation:rise .4s var(--ease)}
.eg .circ{width:62px;height:62px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.eg h3{margin:.3rem 0 0;font-size:1.9rem;font-weight:800}.eg p{margin:0;max-width:340px}
.song{display:inline-flex;align-items:center;gap:.6rem;background:var(--soft);border-radius:20px;padding:.3rem .9rem .3rem .3rem;margin:.4rem 0}
.song button{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg)}.song img,.sa{width:32px;height:32px;border-radius:6px}.song>span:not(.av),.rq>span:not(.av){display:grid;line-height:1.15}
.rq{display:flex;align-items:center;gap:.7rem;padding:.5rem;border-radius:10px;width:100%;text-align:left;cursor:pointer;transition:background .2s}.rq.on,.rq:hover{background:var(--soft)}.rq>span:not(.av){flex:1;min-width:0}
.reqs{border:1px solid var(--line);border-radius:12px;padding:.6rem;margin:1rem 1rem 0;animation:rise .4s var(--ease)}
@media(max-width:760px){.pt{gap:1.2rem;padding:0}.pt .av{width:80px!important;height:80px!important;font-size:34px!important}.cnt{gap:1rem}.tab{padding:.9rem 1rem}.tab span{display:none}.hl{padding:1.2rem 0}.prof{padding-top:1rem}}

/* ---------- janelas ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:1rem;animation:fadeIn .22s ease}
.ov.out{animation:fadeOut .2s ease forwards}.ov.out .box,.ov.out .sbox{animation:zoomOut .2s ease forwards}
.box{background:var(--soft);border-radius:16px;padding:1.1rem;width:min(480px,100%);max-height:90vh;overflow:auto;animation:zoomIn .32s var(--ease)}
.box.wide{width:min(1020px,100%);padding:0;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.box.sheet{width:min(400px,100%);padding:0;text-align:center}.box.sheet button{display:block;width:100%;padding:.95rem;border-bottom:1px solid var(--line)}.box.sheet button:last-child{border:0}.box.sheet button:hover{background:var(--soft2)}.box.sheet .rd{color:#ff5c6a;font-weight:700}
.box h3{margin:0 0 .6rem}.box label{display:block;margin:.7rem 0 .2rem;color:var(--mute)}.box label.chk{display:flex;gap:.5rem;align-items:center;color:var(--ink)}.chk input{width:auto}
.box input,.box textarea{background:var(--bg)}
.drop{display:grid;place-items:center;min-height:210px;border:2px dashed var(--soft2);border-radius:14px;cursor:pointer;text-align:center;color:var(--mute);overflow:hidden;margin:0!important;transition:border-color .2s,background .2s}
.drop:hover{border-color:var(--blue);background:rgba(76,95,255,.06)}.drop img,.drop video{width:100%;max-height:300px;object-fit:cover}
.pdet{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);height:min(86vh,680px)}
.pdm{background:#000;display:grid;place-items:center;min-height:0}.pdm img,.pdm video{width:100%;height:100%;object-fit:contain}
.pdr{display:flex;flex-direction:column;min-height:0;min-width:0}
.pdh{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem;border-bottom:1px solid var(--line)}.pdh b{cursor:pointer;flex:1}
.pdc{flex:1;overflow:auto;padding:1rem}.pdc p{margin:.1rem 0 .7rem}.pdr .pa{padding:.7rem 1rem .2rem;border-top:1px solid var(--line)}
.pdr .pl{padding:0 1rem .5rem;font-weight:700}.pdr .pin{border-top:1px solid var(--line);padding:.2rem 1rem}.pdr .pin input{border:0;background:none;box-shadow:none;padding:.7rem 0}
@media(max-width:760px){.pdet{grid-template-columns:1fr;height:auto;max-height:88vh;overflow:auto}.pdm{max-height:50vh}.pdc{max-height:30vh}}
.ov.dark{background:#000;backdrop-filter:none}
.sbox{position:relative;width:min(400px,100%);height:min(88vh,720px);background:#111;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.sbox.first{animation:zoomIn .4s var(--ease)}
.sbox .sm{width:100%;height:100%;object-fit:contain;animation:fadeIn .3s ease}
.bars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:2}.bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;position:relative;overflow:hidden}.bars i.f{background:#fff}
.bars i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0);animation:fill linear forwards}
.sh{position:absolute;top:18px;left:10px;right:10px;display:flex;gap:.5rem;align-items:center;color:#fff;z-index:3}.sh small{color:#ddd}.sh button{margin-left:auto;color:#fff}
.tl,.tr{position:absolute;top:60px;bottom:0;width:40%;z-index:1}.tl{left:0}.tr{right:0}

/* ---------- mensagens ---------- */
#chat{display:grid;grid-template-columns:320px 1fr;max-width:935px;margin:1rem auto;height:calc(100vh - 2rem);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#cl{border-right:1px solid var(--line);overflow:auto;padding:.5rem}#cl h3{margin:.8rem .6rem}
#room{display:flex;flex-direction:column;min-width:0}.rh{padding:.9rem 1rem;border-bottom:1px solid var(--line);font-weight:700}
#msgs{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.35rem}
.m{max-width:75%;padding:.55rem .9rem;border-radius:20px;background:var(--soft);overflow-wrap:anywhere;animation:zoomIn .25s var(--ease);transform-origin:left bottom}
.m.me{align-self:flex-end;background:var(--blue);color:#fff;transform-origin:right bottom}
#send{display:flex;gap:.5rem;padding:.7rem;border-top:1px solid var(--line)}
.mp{width:200px;cursor:pointer;margin-bottom:.3rem}.mp img,.mp video{width:100%;border-radius:10px;max-height:240px;object-fit:cover;display:block}.mp small{color:inherit}
@media(max-width:760px){#chat{grid-template-columns:1fr;height:auto;margin:0;border:0;border-radius:0}#room{height:60vh}#cl{display:flex;overflow-x:auto;border:0}#cl h3{display:none}#cl .rq{width:auto}}
#pill{position:fixed;right:24px;bottom:24px;display:flex;align-items:center;gap:.8rem;background:var(--soft);padding:.7rem 1.1rem;border-radius:30px;font-weight:700;box-shadow:0 6px 30px rgba(0,0,0,.5);z-index:20;animation:slideUp .5s var(--ease)}
#pill:hover{background:var(--soft2);transform:translateY(-2px)}
@media(max-width:760px){#pill{display:none}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--soft2);color:#fff;padding:.65rem 1.1rem;border-radius:10px;z-index:99;animation:slideUp .3s var(--ease);box-shadow:0 6px 24px rgba(0,0,0,.5)}
</style>
</head>
<body>

<section id="auth">
  <img src="/logo.png" alt="">
  <h1>Anarchy</h1>
  <input id="u" placeholder="Nome de usuário" autocomplete="username">
  <input id="p" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth('login')">
  <div class="row"><button class="bl" onclick="auth('login')">Entrar</button><button class="gh" onclick="auth('register')">Criar conta</button></div>
  <p class="err" id="aerr"></p>
</section>

<div id="app" class="hide">
  <nav id="side"></nav>
  <main><div id="view"></div></main>
  <button id="pill" class="hide" onclick="go('chats')"></button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let token = localStorage.token, me, sock, peer = null, pendingPeer = null, view = 'home', G = [], SR = [], song = {}, au, stTimer, sT;
let panel = null, nfAll = [], nfFilter = 'all', unread = 0, muted = true, curTab = 'feed', lastProf = null, PD = {}, JL = null;
const P = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = (t) => String(t ?? '').replace(/(https?:\/\/[^\s<]+)|(^|[^\w@\/])@([a-zA-Z0-9_]{3,20})/g, (m, url, pre, un) => url
  ? `<a href="${url}" target="_blank" rel="noopener" style="color:var(--link);text-decoration:underline">${url}</a>`
  : `${pre}<a onclick="event.stopPropagation();go('profile','${un.toLowerCase()}')" style="color:var(--link);cursor:pointer;font-weight:600">@${un}</a>`);
const rt = (t) => {
  const s = (Date.now() - t) / 1e3;
  if (s < 60) return 'agora'; if (s < 3600) return Math.floor(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h';
  if (s < 604800) return Math.floor(s / 86400) + ' d'; if (s < 2592000) return Math.floor(s / 604800) + ' sem';
  return new Date(t).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
};
const vf = (v) => (v ? '<span class="vf" title="Verificado">✓</span>' : '');
const av = (u, s = 32) => (u && u.avatar
  ? `<img class="av" style="width:${s}px;height:${s}px" src="${u.avatar}" alt="">`
  : `<span class="av" style="width:${s}px;height:${s}px;font-size:${s / 2.2}px">${esc(((u && u.username) || '?')[0].toUpperCase())}</span>`);
const toast = (t) => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); };
const EMOJIS = ['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','🥰','😍','🤩','😘','😗','😚','😋','😛','😜','🤪','😝','🤗','🤭','🤫','🤔','😐','😑','😶','🙄','😏','😒','🙁','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','😢','😭','😤','😠','😡','🤬','🤯','😳','😱','😨','😰','😥','😓','🤗','😋','😜','😝','🤪','🤨','🧐','🤓','😎','🥳','😏','😒','🙄','😬','😥','😓','😔','😕','🙁','☹️','😣','😖','😫','😩','😢','😭','😤','😠','😡','🤬','🤯','😳','😱','😨','😰','😥','😓','😭','😂','🤣','😊','😍','😘','🥰','😎','🤩','🥳','😉','🙂','🤗','🤭','🤫','🤔','😐','😑','😶','😏','😒','🙄','😬','🤨','🧐','🤓','😎','🥳'];
function openEmojiPicker(insertIntoId) {
  const items = EMOJIS.map((e) => `<button onclick="insertEmoji('${insertIntoId}','${e}')" style="font-size:1.5rem;padding:.2rem;border-radius:6px">${e}</button>`).join('');
  modal(`<h3>Escolha um emoji</h3><div style="display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center">${items}</div><button class="gh" onclick="closeM()">Fechar</button>`);
}
function insertEmoji(inputId, emoji) {
  const el = document.getElementById(inputId);
  if (!el) return;
  const start = el.selectionStart || 0;
  const end = el.selectionEnd || 0;
  const val = el.value;
  el.value = val.slice(0, start) + emoji + val.slice(end);
  el.selectionStart = el.selectionEnd = start + emoji.length;
  el.focus();
}
const RL = { none: 'Seguir', ok: 'Seguindo', pending: 'Solicitado' };

/* ---------- ícones ---------- */
const IC = {
  home: '<path d="M3 11.2 12 3l9 8.2V20a1 1 0 0 1-1 1h-5v-6.5H9V21H4a1 1 0 0 1-1-1z"/>',
  reels: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3.5 8.5h17M9 3.2l3 5.3M15 3.2l3 5.3"/><path d="M10.5 12.3v5l4.3-2.5z" fill="currentColor"/>',
  send: '<path d="M21.5 3 10.2 14.3"/><path d="M21.5 3l-6.8 18-4.5-6.7L3.5 9.8z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.6-4.6"/>',
  heart: '<path d="M12 20.8S3.5 15.7 3.5 9.4A4.7 4.7 0 0 1 12 6.8a4.7 4.7 0 0 1 8.5 2.6c0 6.3-8.5 11.4-8.5 11.4z"/>',
  plus: '<path d="M12 4.5v15M4.5 12h15"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  comment: '<path d="M20.8 11.6a8.6 8.6 0 0 1-12.4 7.7L3.5 20.5l1.3-4.5a8.6 8.6 0 1 1 16-4.4z"/>',
  repost: '<path d="m17 2.5 3.5 3.5L17 9.5"/><path d="M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5"/><path d="m7 21.5-3.5-3.5L7 14.5"/><path d="M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/>',
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>',
  tag: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19c.8-2.8 3-4.2 5.5-4.2s4.7 1.4 5.5 4.2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6 8-6s7 1.8 8 6"/>',
  dots: '<circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>',
  x: '<path d="M5 5l14 14M19 5 5 19"/>',
  play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
  voloff: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="m16 9.5 5 5M21 9.5l-5 5"/>',
  volon: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
  camera: '<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.3-2h5.4L16 6h1.5A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.6"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  shield: '<path d="M12 3l7 3v5c0 5-3.2 8.6-7 10-3.8-1.4-7-5-7-10V6z"/><path d="m9 12 2.2 2.2L15 10"/>',
  logout: '<path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9"/><path d="M16 8l4 4-4 4M20 12H9"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  smile: '<circle cx="12" cy="12" r="10"/><path d="M10 15c.4 0 .8-.1 1.2-.3l1.5-1.5c.6-.6 1.5-.6 2.1 0l1.5 1.5c.3.1.7.3 1.2.3"/><circle cx="9.5" cy="9.5" r="1.5"/><circle cx="14.5" cy="9.5" r="1.5"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  expand: '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 3h-3a2 2 0 0 0-2 2v3M3 16h3a2 2 0 0 0 2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>',
};
const I = (n, s = 24) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const media = (p, full) => (p.type === 'video'
  ? `<video src="${p.media}" ${full ? 'controls' : 'loop muted data-auto="feed" onclick="togglePlay(this)"'} playsinline preload="metadata"></video>${full ? '' : `<button class="mute" onclick="toggleMute()">${I(muted ? 'voloff' : 'volon', 16)}</button>`}`
  : `<img src="${p.media}" alt="">`);

async function api(url, o = {}) {
  o.headers = { ...(o.headers || {}), Authorization: 'Bearer ' + token };
  if (o.json) { o.body = JSON.stringify(o.json); o.headers['Content-Type'] = 'application/json'; o.method = o.method || 'POST'; }
  const r = await fetch(url, o);
  let d;
  try { d = await r.json(); } catch {
    const t = await r.text().catch(() => '');
    throw new Error(t || `Erro ${r.status} (resposta não-JSON).`);
  }
  if (r.status === 401 && token) logout();
  if (!r.ok) throw new Error(d.error || `Erro ${r.status}.`);
  return d;
}

async function auth(k) {
  try {
    const r = await fetch('/api/' + k, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    token = localStorage.token = d.token; start();
  } catch (e) { $('aerr').textContent = e.message; }
}
function logout() { localStorage.clear(); location.reload(); }
async function start() {
  try { me = await api('/api/me'); } catch { return; }
  $('auth').classList.add('hide'); $('app').classList.remove('hide');
  renderSide();
  sock = io({ auth: { token } });
  sock.on('msg', (m) => {
    if (view === 'chats' && peer && (m.from_id === peer.id || m.to_id === peer.id)) addMsg(m);
    else if (m.to_id === me.id) { unread++; badges(); }
  });
  sock.on('notif', () => { badges(); if (panel === 'notifs') loadNotifs(); });
  badges();
  const h = location.hash;
  h.startsWith('#@') ? go('profile', h.slice(2)) : go('home');
}

/* ---------- barra lateral ---------- */
function renderSide() {
  const items = [
    ['home', 'home', 'Página inicial'], ['reels', 'reels', 'Reels'], ['chats', 'send', 'Mensagens', 'bd-m'],
  ];
  const nv = ([v, ic, t, b]) => `<button class="nv" data-v="${v}" onclick="go('${v}')"><i class="ii">${I(ic, 26)}${b ? `<em class="bd hide" id="${b}"></em>` : ''}</i><span>${t}</span></button>`;
  $('side').innerHTML = `<button class="lw" onclick="go('home')" aria-label="Início"><img src="/logo.png" alt=""><span class="lt">PELÉGRAM</span></button>
    ${items.map(nv).join('')}
    <button class="nv" data-p="search" onclick="togglePanel('search')"><i class="ii">${I('search', 26)}</i><span>Pesquisa</span></button>
    <button class="nv" data-p="notifs" onclick="togglePanel('notifs')"><i class="ii">${I('heart', 26)}<em class="bd hide" id="bd-n"></em></i><span>Notificações</span></button>
    <button class="nv" onclick="newPost()"><i class="ii">${I('plus', 26)}</i><span>Criar</span></button>
    <button class="nv" data-v="profile" onclick="go('profile',me.username)"><i class="ii">${av(me, 26)}</i><span>Perfil</span></button>
    <button class="nv sp" data-more="1" onclick="toggleMore(event)"><i class="ii">${I('menu', 26)}</i><span>Mais</span></button>`;
  $('pill').innerHTML = `<i class="ii" style="position:relative">${I('send', 24)}<em class="bd hide" id="bd-p"></em></i>Mensagens${av(me, 28)}`;
  markNav(); badges(true);
}
function markNav() {
  document.querySelectorAll('.nv').forEach((b) => b.classList.toggle('on', panel ? b.dataset.p === panel : b.dataset.v === view));
}
async function badges(local) {
  const set = (id, n) => { const e = $(id); if (!e) return; e.textContent = n > 9 ? '9+' : n; e.classList.toggle('hide', !n); };
  set('bd-m', unread); set('bd-p', unread);
  if (local) return;
  try { set('bd-n', (await api('/api/notifs/count')).n); } catch {}
}

function go(v, arg) {
  view = v; if (au) au.pause(); if (v !== 'chats') peer = null;
  if (v === 'chats') { unread = 0; badges(true); }
  closePanel(true); closeMore(true); closeM(true); closeS(true);
  const el = $('view'); el.className = ''; void el.offsetWidth; el.className = 'fx';
  $('pill').classList.toggle('hide', v === 'chats');
  markNav(); window.scrollTo(0, 0);
  if (v === 'profile') history.replaceState(null, '', '#@' + (arg || me.username)); else if (location.hash) history.replaceState(null, '', location.pathname);
  ({ home, explore, chats, profile, reels }[v])(arg);
}

/* ---------- painéis e menu ---------- */
function togglePanel(k) { panel === k ? closePanel() : openPanel(k); }
function openPanel(k) {
  closePanel(true); closeMore(true); panel = k; document.body.classList.add('pn');
  const d = document.createElement('div'); d.id = 'panel'; document.body.appendChild(d);
  if (k === 'notifs') { d.innerHTML = '<h2>Notificações</h2><div class="chips"></div><div id="nl"><div class="sk" style="height:60px;margin:.5rem 1.4rem"></div><div class="sk" style="height:60px;margin:.5rem 1.4rem"></div><div class="sk" style="height:60px;margin:.5rem 1.4rem"></div></div>'; loadNotifs(true); }
  else {
    d.innerHTML = '<h2>Pesquisa</h2><div style="padding:0 1.4rem .8rem"><input id="sq" placeholder="Pesquisar pessoas" autocomplete="off" oninput="search(this.value)"></div><div class="sres" id="sres"><p class="empty">Digite um nome ou @usuário.</p></div><div style="padding:0 1.4rem"><button class="lnk" onclick="go(\'explore\')">Explorar publicações →</button></div>';
    setTimeout(() => $('sq') && $('sq').focus(), 250);
  }
  markNav();
}
function closePanel(now) {
  const d = $('panel'); panel = null; document.body.classList.remove('pn'); markNav();
  if (!d) return; d.removeAttribute('id');
  if (now) return d.remove();
  d.classList.add('out'); setTimeout(() => d.remove(), 200);
}
function toggleMore(e) {
  e.stopPropagation();
  if ($('more')) return closeMore();
  closePanel(true);
  const d = document.createElement('div'); d.id = 'more';
  d.innerHTML = `<button onclick="go('explore')">${I('compass', 22)}Explorar</button>
    <button onclick="verify();closeMore()">${I('shield', 22)}${me.verified ? 'Cancelar Verificado' : 'Obter Verificado grátis'}</button>
    <button onclick="logout()">${I('logout', 22)}Sair</button>`;
  document.body.appendChild(d);
}
function closeMore(now) {
  const d = $('more'); if (!d) return; d.removeAttribute('id');
  if (now) return d.remove();
  d.classList.add('out'); setTimeout(() => d.remove(), 150);
}
document.addEventListener('mousedown', (e) => {
  if ($('more') && !e.target.closest('#more')) closeMore();
  if (panel && !e.target.closest('#panel') && !e.target.closest('#side') && !e.target.closest('.ov')) closePanel();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('sv')) closeS(); else if ($('m')) closeM(); else if ($('more')) closeMore(); else if (panel) closePanel(); }
  if ($('sv')) { if (e.key === 'ArrowRight') $('sv').querySelector('.tr').click(); if (e.key === 'ArrowLeft') $('sv').querySelector('.tl').click(); }
});

/* ---------- notificações ---------- */
const NT = { follow: 'começou a seguir você.', request: 'pediu para seguir você.', like: 'curtiu sua publicação.', comment: 'comentou na sua publicação.', repost: 'republicou sua publicação.', tag: 'marcou você em uma publicação.', mention: 'mencionou você em um comentário.', story_mention: 'mencionou você em um story.', story_view: 'viu seu story.' };
const NF = { all: ['Tudo', null], follow: ['Seguidores', ['follow', 'request']], like: ['Curtidas', ['like']], comment: ['Comentários', ['comment', 'mention']], tag: ['Marcações', ['tag', 'repost', 'story_mention']] };
async function loadNotifs(first) {
  try { nfAll = await api('/api/notifs'); } catch { return; }
  if (panel !== 'notifs') return;
  renderNotifs(first);
  if (nfAll.some((n) => !n.seen)) { await api('/api/notifs/read', { method: 'POST' }); const b = $('bd-n'); if (b) b.classList.add('hide'); }
}
function renderNotifs(anim) {
  const d = $('panel'); if (!d || panel !== 'notifs') return;
  d.querySelector('.chips').innerHTML = Object.entries(NF).map(([k, [t]]) => `<button class="chip ${nfFilter === k ? 'on' : ''}" onclick="nfFilter='${k}';renderNotifs(true)">${t}</button>`).join('');
  const f = NF[nfFilter][1], list = nfAll.filter((n) => !f || f.includes(n.type));
  const now = Date.now(), groups = [['Hoje', (n) => now - n.created < 864e5], ['Esta semana', (n) => now - n.created < 6048e5], ['Anteriores', () => true]];
  let left = list, html = '', i = 0;
  groups.forEach(([t, fn]) => {
    const g = left.filter(fn); left = left.filter((n) => !fn(n)); if (!g.length) return;
    html += `<h4>${t}</h4>` + g.map((n) => {
      const act = n.type === 'request'
        ? `<button class="bl" onclick="event.stopPropagation();nreq(${n.uid},'accept')">Aceitar</button><button class="gh" onclick="event.stopPropagation();nreq(${n.uid},'decline')">Recusar</button>`
        : n.type === 'follow' ? `<button class="${n.rel === 'none' ? 'bl' : 'gh'}" onclick="event.stopPropagation();nfollow(${n.uid},this)">${n.rel === 'none' ? 'Seguir de volta' : RL[n.rel]}</button>`
        : n.media ? (n.ptype === 'video' ? `<video class="th" src="${n.media}#t=0.1" muted preload="metadata"></video>` : `<img class="th" src="${n.media}" alt="">`) : '';
      const click = n.post_id && n.type !== 'follow' && n.type !== 'story_view' ? `openPostById(${n.post_id})` : `go('profile','${n.username}')`;
      return `<div class="nt ${n.seen ? '' : 'new'}" style="--i:${i++};${anim ? 'animation:rise .4s var(--ease) both;animation-delay:' + Math.min(i, 12) * 40 + 'ms' : ''}" onclick="${click}">${av(n, 44)}
        <div class="tx"><b>${esc(n.username)}</b>${vf(n.verified)} ${NT[n.type] || ''} <small>${rt(n.created)}</small>${n.text && (n.type === 'comment' || n.type === 'mention') ? `<div class="cprev" style="color:var(--mute);font-size:.85rem;margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px">“${esc(n.text)}”</div>` : ''}</div>${act}</div>`;
    }).join('');
  });
  $('nl').innerHTML = html || `<p class="empty">${nfFilter === 'all' ? 'Nenhuma notificação ainda.' : 'Nada por aqui.'}</p>`;
}
async function nfollow(id, b) { const r = await api('/api/follow/' + id, { method: 'POST' }); b.textContent = r.status === 'none' ? 'Seguir de volta' : RL[r.status]; b.className = r.status === 'none' ? 'bl' : 'gh'; }
async function nreq(id, a) { await api(`/api/requests/${id}/${a}`, { method: 'POST' }); loadNotifs(); }
async function openPostById(id) { try { const p = await api('/api/post/' + id); P[id] = p; closePanel(); openPost(id); } catch (e) { toast(e.message); } }

/* ---------- Janela (modal) ---------- */
function modal(h, cls = '') {
  closeM(true);
  const d = document.createElement('div'); d.id = 'm'; d.className = 'ov';
  d.onmousedown = (e) => { if (e.target === d) closeM(); };
  d.innerHTML = `<div class="box ${cls}">${h}</div>`; document.body.appendChild(d);
}
function closeM(now) {
  const d = $('m'); if (!d) return; d.removeAttribute('id');
  if (now) return d.remove();
  d.classList.add('out'); setTimeout(() => d.remove(), 200); resumeBehind();
}
let pausedByModal = [];
function pauseBehind() { pausedByModal = [...document.querySelectorAll('video[data-auto]')].filter((v) => !v.paused); pausedByModal.forEach((v) => v.pause()); }
function resumeBehind() { if ($('m')) return; pausedByModal.forEach((v) => { if (v.isConnected) v.play().catch(() => {}); }); pausedByModal = []; }
function openPost(id, focus) { pauseBehind(); modal(postDetail(P[id]), 'wide'); watch(); if (focus) setTimeout(() => { const i = document.querySelector('#m .pin input'); if (i) i.focus(); }, 300); }

/* ---------- Posts ---------- */
const acts = (p) => `<button class="ab lk ${p.liked ? 'on' : ''} ${JL === p.id ? 'pop' : ''}" onclick="like(${p.id})" title="Curtir">${I('heart', 26)}${p.likes ? `<span>${p.likes}</span>` : ''}</button>

};

function refresh(p) {
  P[p.id] = p;
  document.querySelectorAll(`[data-pa="${p.id}"]`).forEach((e) => { e.innerHTML = acts(p); });
  document.querySelectorAll(`[data-pl="${p.id}"]`).forEach((e) => { e.innerHTML = e.closest('.pdr') ? `${likesTxt(p)} · <small>${rt(p.created)}</small>` : likesTxt(p); });

async function like(id) { await api(`/api/posts/${id}/like`, { method: 'POST' }); JL = P[id] && !P[id].liked ? id : null; await reload(id); JL = null; }
function dbl(id, el) {
  if (!P[id].liked) like(id);
  const h = document.createElement('span'); h.className = 'bh'; h.innerHTML = `<svg width="90" height="90" viewBox="0 0 24 24" fill="#fff"><path d="M12 20.8S3.5 15.7 3.5 9.4A4.7 4.7 0 0 1 12 6.8a4.7 4.7 0 0 1 8.5 2.6c0 6.3-8.5 11.4-8.5 11.4z"/></svg>`;
  el.appendChild(h); setTimeout(() => h.remove(), 800);
}

async function cmt(id, el) { const t = el.value; if (!t.trim()) return; el.value = ''; await api(`/api/posts/${id}/comments`, { json: { text: t } }); reload(id); }
async function repost(id) { try { await api(`/api/posts/${id}/repost`, { method: 'POST' }); toast('Republicado no seu perfil'); reload(id); } catch (e) { toast(e.message); } }
function postMenu(id) {

    <button onclick="share(${id})">Enviar para...</button><button class="rd" onclick="closeM()">Cancelar</button>`, 'sheet');

async function share(id) {
  const us = await api('/api/chats');
  modal(`<h3>Enviar para</h3>${us.map((u) => `<div class="rq">${av(u, 40)}<span>${esc(u.username)}</span><button class="bl" onclick="sendPost(${u.id},${id},this)">Enviar</button></div>`).join('') || '<p class="empty">Siga alguém para poder enviar posts.</p>'}`);

function sendPost(to, id, b) { sock.emit('msg', { to, post_id: id }); b.textContent = 'Enviado ✓'; b.disabled = true; }

/* ---------- vídeos: autoplay ao aparecer na tela ---------- */
const vio = new IntersectionObserver((es) => es.forEach((e) => {
  const v = e.target;
  if (e.isIntersecting && e.intersectionRatio >= .6 && !$('m')) { v.muted = muted; v.play().catch(() => {}); } else v.pause();
}), { threshold: [0, .6, 1] });
function watch() { document.querySelectorAll('video[data-auto]').forEach((v) => { if (!v._w) { v._w = 1; vio.observe(v); } }); }
function togglePlay(v) { v.paused ? v.play().catch(() => {}) : v.pause(); }
function toggleMute() {
  muted = !muted;
  document.querySelectorAll('video[data-auto]').forEach((v) => { v.muted = muted; });
  document.querySelectorAll('.mute').forEach((b) => { b.innerHTML = I(muted ? 'voloff' : 'volon', 16); });
}

/* ---------- Criar ---------- */
function newPost(mode) {
  modal(`<h3>${mode === 'story' ? 'Novo story' : 'Criar publicação'}</h3>
  <label class="drop" for="nf" id="pv">${I('camera', 44)}<p>Clique para escolher uma foto ou vídeo</p></label>
  <input type="file" id="nf" class="hide" accept="image/*,video/*" onchange="prev(this)">
  <textarea id="nc" placeholder="Legenda..." maxlength="500"></textarea>
  <input id="nt" placeholder="Marcar pessoas: @usuario1 @usuario2" maxlength="200">
  <div class="row" style="margin-top:.7rem"><button class="${mode === 'story' ? 'gh' : 'bl'}" onclick="sendMedia('post')">Publicar</button><button class="${mode === 'story' ? 'bl' : 'gh'}" onclick="sendMedia('story')">Postar no story</button></div><p class="err" id="ne"></p>`);
}
function prev(i) {
  const f = i.files[0]; if (!f) return;
  const u = URL.createObjectURL(f);
  $('pv').innerHTML = f.type.startsWith('video') ? `<video src="${u}" muted autoplay loop playsinline></video>` : `<img src="${u}" alt="">`;
}
async function sendMedia(k) {
  const f = $('nf').files[0]; if (!f) return ($('ne').textContent = 'Escolha uma foto ou vídeo.');
  const fd = new FormData(); fd.append('media', f); fd.append('caption', $('nc').value); fd.append('tags', $('nt').value);
  if (k === 'story') fd.append('mentions', $('nt').value);
  $('ne').textContent = 'Enviando...';
  try { await api(k === 'story' ? '/api/stories' : '/api/posts', { method: 'POST', body: fd }); go(k === 'story' ? 'home' : 'profile', me.username); }
  catch (e) { $('ne').textContent = e.message; }
}

function closeS(now) {
  clearTimeout(stTimer); const o = $('sv'); if (!o) return;
  o.removeAttribute('id'); if (now) return o.remove();
  o.classList.add('out'); setTimeout(() => o.remove(), 200);
}
function openStory(gi, si = 0) {
  clearTimeout(stTimer);
  const g = G[gi]; if (!g) return closeS();
  const s = g.items[si]; if (!s) return openStory(gi + 1, 0);
  viewStory(s.id);
  const own = g.uid === me.id;
  let o = $('sv'), first = !o;
  if (!o) { o = document.createElement('div'); o.id = 'sv'; o.className = 'ov dark'; o.onmousedown = (e) => { if (e.target === o) closeS(); }; document.body.appendChild(o); }
  const vid = s.type === 'video';
  o.innerHTML = `<div class="sbox ${first ? 'first' : ''}"><div class="bars">${g.items.map((_, i) => `<i class="${i < si ? 'f' : ''}">${i === si ? `<b id="sb" style="animation-duration:5s;${vid ? 'animation-play-state:paused' : ''}"></b>` : ''}</i>`).join('')}</div>
    <div class="sh">${av(g, 32)}${vf(g.verified)}<b>${esc(g.username)}</b><small>${rt(s.created)}</small>
      ${s.mentions ? `<small style="color:#8fa0ff"> ${s.mentions.split(',').filter(Boolean).map((n) => `<a onclick="closeS();go('profile','${esc(n)}')" style="cursor:pointer">@${esc(n)}</a>`).join(' ')} </small>` : ''}
      ${own ? `<button onclick="storyMenu(${s.id})" style="color:#fff">${I('dots', 16)}</button>` : `<button onclick="getStoryViews(${s.id})" style="color:#fff">${I('heart', 16)}</button>`}
      <button onclick="closeS()" aria-label="Fechar">${I('x', 22)}</button></div>
    ${vid ? `<video class="sm" src="${s.media}" autoplay playsinline></video>` : `<img class="sm" src="${s.media}" alt="">`}
    <div style="position:absolute;bottom:14px;left:10px;right:10px;display:flex;gap:.5rem;align-items:center;color:#fff;z-index:3">
      <button onclick="likeStory(${s.id})" style="flex:1">${I('heart', 20)}<span id="story-like-${s.id}"></span></button>
      <button onclick="commentStory(${s.id})" style="flex:1">${I('comment', 20)}</button>
      <button onclick="loadStoryReactions(${s.id})" style="flex:1">${I('dots', 16)}</button>
    </div>
    <div class="tl" onclick="openStory(${gi},${Math.max(0, si - 1)})"></div><div class="tr" onclick="openStory(${gi},${si + 1})"></div></div>`;
  if (vid) {
    const v = o.querySelector('video'), b = $('sb');
    v.onloadedmetadata = () => { b.style.animationDuration = (v.duration || 5) + 's'; b.style.animationPlayState = 'running'; };
    v.onended = () => openStory(gi, si + 1);
  } else stTimer = setTimeout(() => openStory(gi, si + 1), 5000);
}

const TABS = [['feed', 'grid', 'Feed'], ['reels', 'reels', 'Reels'], ['reposts', 'repost', 'Republicado'], ['tagged', 'tag', 'Marcações']];
async function profile(name) {
  name = name || me.username;
  let d;
  try { d = await api('/api/u/' + encodeURIComponent(name)); } catch (e) { $('view').innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
  if (view !== 'profile') return;
  const u = d.user, self = d.rel === 'self';
  if (self) { me = u; renderSide(); }
  if (lastProf !== u.username) { curTab = 'feed'; lastProf = u.username; }
  const reqs = self ? await api('/api/requests') : [];
  // verificar se o usuário tem story ativo (indicador no perfil)
  let hasStory = false;
  try {
    const st = await api('/api/stories');
    hasStory = st.some((g) => g.uid === u.id && g.items.some((s) => !s.expired && s.expires_at > Date.now()));
  } catch {}
  [...d.items, ...d.tagged].forEach((p) => { P[p.id] = p; });
  PD = {
    feed: d.items.filter((p) => !p.repost_of && p.type === 'image'),
    reels: d.items.filter((p) => !p.repost_of && p.type === 'video'),
    reposts: d.items.filter((p) => p.repost_of),
    tagged: d.tagged, self, name: u.username,
  };
  const btns = self
    ? `<button class="gh" onclick="editProfile()">Editar perfil</button><button class="gh" onclick="changeUsernameUI()">Trocar username</button><button class="gh" onclick="shareProfile('${u.username}')">Compartilhar perfil</button>`
    : `<button class="${d.rel === 'none' ? 'bl' : 'gh'}" onclick="follow(${u.id},'${u.username}')">${RL[d.rel]}</button><button class="gh" onclick="openChat(${u.id},'${u.username}')">Mensagem</button><button class="gh" onclick="blockUser(${u.id})">Bloquear @${esc(u.username)}</button>`;
  $('view').innerHTML = `<div class="prof"><div class="pt">${hasStory ? `<div class="ring" style="display:inline-block;margin-right:8px">${av(u, 156)}</div>` : av(u, 150)}<div class="pi">
      <div class="row"><h2>${esc(u.username)}${vf(u.verified)}</h2>${u.private ? `<small title="Conta privada">${I('lock', 16)}</small>` : ''}</div>
      <div class="cnt"><span><b>${d.count.posts}</b> posts</span><span><b>${d.count.followers}</b> seguidores</span><span><b>${d.count.following}</b> seguindo</span></div>
      <div class="bio"><b>${esc(u.name || '')}</b><p>${linkify(esc(u.bio || ''))}</p>
      ${u.song_url ? `<div class="song"><button data-src="${esc(u.song_url)}" onclick="playSong(this)" aria-label="Tocar prévia">▶</button>${u.song_art ? `<img src="${esc(u.song_art)}" alt="">` : ''}<span><b>${esc(u.song_title)}</b><small>${esc(u.song_artist)}</small></span></div>` : ''}</div></div></div>

function playSong(b) {
  const s = b.dataset.src;
  if (au && au.src === s && !au.paused) { au.pause(); b.textContent = '▶'; return; }

function playSongPost(src, pid) {
  if (au && au.src === src && !au.paused) { au.pause(); return; }
  if (au) au.pause();
  document.querySelectorAll('.song button').forEach((x) => { x.textContent = '▶'; });
  au = new Audio(src);
  au.play();
  const btn = document.querySelector(`[data-pa="${pid}"] button`);
  if (btn) btn.textContent = '❚❚';
  let slider = document.querySelector('#song-slider-' + pid);
  if (!slider) {
    slider = document.createElement('input');
    slider.type = 'range';
    slider.id = 'song-slider-' + pid;
    slider.style = 'width:120px;margin-top:4px;accent-color:var(--blue)';
    const wrapper = document.querySelector(`[data-pa="${pid}"]`) || document.querySelector(`[data-pl="${pid}"]`);
    if (wrapper) wrapper.parentNode.insertBefore(slider, wrapper.nextSibling);
  }
  au.onloadedmetadata = () => { slider.max = Math.floor(au.duration || 30); };
  au.ontimeupdate = () => { slider.value = Math.floor(au.currentTime); };
  slider.oninput = () => { au.currentTime = slider.value; };
  au.onended = () => { if (btn) btn.textContent = '▶'; slider.value = 0; };
}

// ---- Editar/Excluir Comentário ----
// edição na própria linha: troca o texto por um campo; Enter salva, Esc (ou clicar fora) cancela
function inlineEdit(textEl, current, save, cancel, line = 'var(--blue)') {
  const inp = document.createElement('input');
  inp.value = current; inp.maxLength = 300; inp.autocomplete = 'off';
  inp.style.cssText = `display:inline-block;width:min(100%,260px);min-width:120px;padding:.1rem .3rem;margin:0;border:0;border-bottom:1px solid ${line};border-radius:0;background:transparent;box-shadow:none;font:inherit;color:inherit;outline:0`;
  textEl.style.display = 'none'; textEl.after(inp); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  let done = false;
  const end = (fn) => { if (done) return; done = true; fn(); };
  inp.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); const t = inp.value.trim(); if (!t || t === current.trim()) end(cancel); else end(() => save(t)); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); end(cancel); }
  };
  inp.onblur = () => setTimeout(() => end(cancel), 120);
  return inp;
}
function editComment(pid, cid, btn) {

  const hide = row.querySelectorAll('button, .ed'); hide.forEach((e) => { e.style.display = 'none'; });
  const restore = () => { row.querySelector('input')?.remove(); row.querySelector('.ct').style.display = ''; hide.forEach((e) => { e.style.display = ''; }); };
  inlineEdit(row.querySelector('.ct'), c.text, async (t) => {
    try { await api(`/api/comments/${cid}`, { method: 'PUT', json: { text: t } }); toast('Comentário editado'); reload(pid); } catch (e) { toast(e.message); restore(); }
  }, restore);
}

function editMessage(id, btn) {
  const d = btn ? btn.closest('.m') : document.querySelector(`#msgs [data-mid="${id}"]`);
  if (!d || d.querySelector('input')) return;
  let span = d.querySelector(':scope > span');
  if (!span) { span = document.createElement('span'); d.insertBefore(span, d.querySelector(':scope > div:last-child')); }
  const tools = d.querySelector(':scope > div:last-child'), toolsBefore = tools ? tools.style.display : '';
  if (tools) tools.style.display = 'none';
  const restore = () => { d.querySelector('input')?.remove(); span.style.display = ''; if (tools) tools.style.display = toolsBefore; };
  inlineEdit(span, d.dataset.mtext || '', async (t) => {
    try {
      await api(`/api/messages/${id}`, { method: 'PUT', json: { text: t } });
      d.dataset.mtext = t; span.innerHTML = `${linkify(esc(t))}<small style="color:var(--mute);font-size:.65rem;margin-left:.4rem">editado</small>`;
      restore(); toast('Mensagem editada');
    } catch (e) { toast(e.message); restore(); }
  }, restore, 'rgba(255,255,255,.75)');
}
