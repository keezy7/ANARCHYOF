<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anarchy</title>
<link rel="icon" href="/logo_anarchy.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--ink:#e5e5e5;--mute:#8a8a8a;--line:#222222;--soft:#141414;--soft2:#1a1a1a;--blue:#ff2d2d;--link:#ff4d4d;--red:#ff2d2d;--g:linear-gradient(45deg,#ff2d2d,#8b0000);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{scrollbar-color:var(--soft2) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .15s var(--ease),background .2s,opacity .2s}
button:active{transform:scale(.95)}
input,textarea{width:100%;padding:.65rem .85rem;border:1px solid var(--line);border-radius:10px;background:var(--soft);transition:border-color .2s,box-shadow .2s}#mt{min-height:2.75rem;flex:1;flex-shrink:0;min-width:0}
input:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,95,255,.25)}
textarea{resize:vertical;min-height:70px;margin:.5rem 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bl,.gh{border-radius:10px;padding:.5rem 1rem;font-weight:700;white-space:nowrap}
.bl{background:var(--blue);color:#fff}.bl:hover{filter:brightness(1.12)}
.gh{background:var(--soft)}.gh:hover{background:var(--soft2)}
.lnk{color:var(--link);font-weight:700;font-size:.85rem}.lnk:hover{color:#fff}.lnk.off{color:var(--mute)}
.hide{display:none!important}small{color:var(--mute)}.err{color:#ff5c6a;min-height:1.2em}
.ulink{color:inherit;cursor:pointer;text-decoration:none;font-weight:inherit}.ulink:hover{color:var(--link)}
.empty{color:var(--mute);text-align:center;padding:2rem 0}
.row{display:flex;gap:.5rem;align-items:center}
.av{border-radius:50%;object-fit:cover;background:var(--soft);display:inline-grid;place-items:center;font-weight:700;flex:none}
.vf{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;margin-left:4px;vertical-align:middle}
.ic{display:block;flex:none}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}.ib:hover{background:var(--soft)}

/* ---------- animações ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:none}}
@keyframes zoomOut{to{opacity:0;transform:scale(.92)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(-40px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes popMenu{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes heart{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes ping{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#view.fx{animation:rise .38s var(--ease)}
.stg>*{animation:rise .45s var(--ease) both;animation-delay:calc(min(var(--i,0),14)*45ms)}
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:10px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

/* ---------- login ---------- */
#auth{max-width:350px;margin:7vh auto;padding:2rem 1.5rem;text-align:center;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.015);animation:zoomIn .5s var(--ease)}
#auth img{width:110px;border-radius:24%}
#auth h1{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;margin:.4rem 0 1rem;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#auth input{margin-bottom:.6rem}#auth .row button{flex:1}
.pw{position:relative;margin-bottom:.6rem}
#auth .pw input{margin-bottom:0;padding-right:2.9rem}
.pwt{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.pwt:hover{background:var(--soft2);color:var(--ink)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:300}
#boot img{width:86px;height:auto;border-radius:24%;animation:float 2.4s ease-in-out infinite}

/* ---------- barra lateral ---------- */
#side{position:fixed;left:0;top:0;bottom:0;width:72px;border-right:1px solid var(--line);padding:.8rem .65rem;display:flex;flex-direction:column;gap:.15rem;background:var(--bg);z-index:30;overflow:hidden;transition:width .28s var(--ease),box-shadow .28s}
#side:hover{width:244px;box-shadow:12px 0 40px rgba(0,0,0,.45)}
body.pn #side:hover{width:72px;box-shadow:none}
.lw{display:flex;align-items:center;gap:.8rem;padding:.35rem .35rem 1.2rem;width:100%;text-align:left}
.lw img{width:34px;height:34px;border-radius:24%;flex:none}
.lt{font-weight:800;font-size:1.2rem;letter-spacing:-.03em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.nv{display:flex;gap:1rem;align-items:center;padding:.8rem .75rem;border-radius:12px;font-size:1rem;width:100%;text-align:left;white-space:nowrap;position:relative}
.nv:hover{background:var(--soft)}.nv.on{font-weight:800}.nv.on .ic{stroke-width:2.6}
.nv:hover .ii{transform:scale(1.1)}.ii{position:relative;display:grid;transition:transform .2s var(--ease)}
.nv>span,.lt{opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .25s var(--ease)}
#side:hover .nv>span,#side:hover .lt{opacity:1;transform:none}
body.pn #side:hover .nv>span,body.pn #side:hover .lt{opacity:0;transform:translateX(-8px)}
.sp{margin-top:auto}
.bd{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);animation:ping .35s var(--ease)}
main{margin-left:72px}
#view{min-height:100vh}
@media(max-width:760px){
  #side,#side:hover{top:auto;width:auto;right:0;flex-direction:row;border:0;border-top:1px solid var(--line);padding:.2rem .4rem;justify-content:space-around;box-shadow:none;height:56px}
  .nv>span,.lt,.lw,.sp{display:none}.nv{justify-content:center;width:auto;padding:.7rem}main{margin-left:0;padding-bottom:60px}
  #side .nv[data-more]{display:none}
}

/* ---------- painéis (notificações / pesquisa) ---------- */
#panel{position:fixed;left:72px;top:0;bottom:0;width:397px;max-width:calc(100vw - 72px);background:var(--bg);border-right:1px solid var(--line);border-radius:0 18px 18px 0;z-index:25;overflow-y:auto;padding:1.4rem 0 1rem;box-shadow:10px 0 40px rgba(0,0,0,.4);animation:slideIn .32s var(--ease)}
#panel.out{animation:slideOut .22s ease forwards}
#panel h2{margin:0 1.4rem 1rem;font-size:1.5rem;font-weight:800}
#panel h4{margin:1rem 1.4rem .4rem;font-size:1rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:0 1.4rem .6rem;scrollbar-width:none}
.chip{border:1px solid var(--line);border-radius:20px;padding:.35rem .9rem;white-space:nowrap;font-weight:600;font-size:.85rem}
.chip.on{background:var(--soft2);border-color:var(--soft2)}.chip:hover{background:var(--soft)}
.nt{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.4rem;cursor:pointer;transition:background .2s}
.nt:hover{background:rgba(255,255,255,.04)}.nt.new{background:rgba(76,95,255,.1)}
.sw{display:flex;gap:.7rem;margin:.5rem 0 .2rem}
.sp{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#000;flex:none}
.sb{background:#000;border-radius:12px;padding:.55rem .85rem;max-width:220px}
.st{color:#fff;font-size:.8rem;line-height:1.25}
.nt .tx{flex:1;line-height:1.3}.nt .tx small{white-space:nowrap}
.nt .th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none}
.sres{padding:0 .6rem}
@media(max-width:760px){#panel{left:0;right:0;bottom:56px;width:auto;max-width:none;border-radius:0;animation-name:slideUp}}

/* ---------- menu "Mais" ---------- */
#more{position:fixed;left:12px;bottom:64px;width:262px;background:var(--soft);border-radius:16px;padding:.5rem;z-index:40;box-shadow:0 8px 40px rgba(0,0,0,.6);transform-origin:bottom left;animation:popMenu .22s var(--ease)}
#more.out{animation:zoomOut .15s ease forwards}
#more button{display:flex;gap:.8rem;align-items:center;width:100%;padding:.8rem;border-radius:10px;text-align:left}
#more button:hover{background:var(--soft2)}

/* ---------- início ---------- */
.home{display:flex;justify-content:center;gap:4rem;padding:1.4rem 1rem 5rem}
.hc{width:min(630px,100%);min-width:0}
.rc{width:320px;flex:none;position:sticky;top:1.4rem;align-self:flex-start}
@media(max-width:1180px){.rc{display:none}}
.stories{display:flex;gap:.9rem;overflow-x:auto;padding:0 0 1.2rem;scrollbar-width:none;max-width:470px;margin:0 auto}
.st{display:grid;justify-items:center;gap:.3rem;width:78px;flex:none}.st small{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:.78rem}
.st:hover .ring{transform:scale(1.06)}
.ring{padding:3px;border-radius:50%;background:var(--g);display:grid;transition:transform .2s var(--ease)}.ring.seen{background:#5a606c}.ring .av{border:3px solid var(--bg)}
.post{margin:0 auto 1.4rem;padding-bottom:.8rem;width:min(470px,100%);border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:.6rem;padding:.55rem 0}
.ph b,.ph a{cursor:pointer}.ph .who{flex:1;min-width:0}.ph .who small{margin-left:2px}
.mo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}.mo:hover{background:var(--soft)}
.pm{position:relative;border-radius:6px;overflow:hidden;background:#000}
.pm img,.pm video{width:100%;display:block;max-height:640px;object-fit:cover}
.mute{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;z-index:2}
.bh{position:absolute;left:50%;top:50%;color:#fff;pointer-events:none;animation:burst .8s var(--ease) forwards;filter:drop-shadow(0 4px 16px rgba(0,0,0,.5));z-index:3}
.pa{display:flex;gap:1.1rem;align-items:center;padding:.6rem 0 .3rem}
.ab{display:inline-flex;align-items:center;gap:.4rem;font-weight:600}.ab:hover{opacity:.7}
.ab.lk.on svg{fill:var(--red);stroke:var(--red)}
.sci{flex:1;min-width:0;padding:.65rem 1rem;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,20,.55);color:#fff;backdrop-filter:blur(6px)}.sci::placeholder{color:rgba(255,255,255,.7)}.sci:focus{border-color:#fff;box-shadow:none}
.sl.on svg{fill:var(--red);stroke:var(--red)}.ab.lk.pop svg{animation:heart .45s var(--ease)}
.pb p{margin:.2rem 0}.pb .pl{font-weight:700}.pb input{border:0;background:none;padding:.5rem 0;box-shadow:none}
.pb .more{color:var(--mute);cursor:pointer;display:inline-block;margin:.1rem 0}
.tg a{color:var(--link);cursor:pointer;margin-right:.35rem}
.ro{color:var(--mute);font-size:.8rem}
.acc{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}.acc>span:not(.av){flex:1;display:grid;line-height:1.2;min-width:0}
.sg{display:flex;align-items:center;gap:.8rem;padding:.45rem 0;animation:rise .4s var(--ease) both}.sg>span:not(.av){flex:1;display:grid;line-height:1.25;min-width:0}.sg>span:not(.av) *{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg b,.acc b{cursor:pointer}
.foot{margin-top:1.6rem;color:#5d6572;font-size:.75rem;line-height:1.7}

/* ---------- reels ---------- */
.reels{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;display:flex;flex-direction:column;align-items:center}
.reel{position:relative;flex:none;height:100vh;width:min(430px,100%);scroll-snap-align:start;padding:14px 0;display:flex}
.reel video{width:100%;height:100%;object-fit:cover;border-radius:14px;background:#000;cursor:pointer}
.reel .mute{top:28px;right:14px;bottom:auto}
.vc{position:absolute;right:12px;bottom:12px;z-index:2;display:flex;align-items:center;flex-direction:row;background:rgba(0,0,0,.6);border-radius:20px;color:#fff}
.vc .vb{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:#fff;flex:none}
.vsl{-webkit-appearance:none;appearance:none;width:0;opacity:0;margin:0;padding:0;height:4px;border:0;border-radius:4px;box-shadow:none;background:linear-gradient(to right,#fff var(--p,100%),rgba(255,255,255,.3) var(--p,100%));cursor:pointer;transition:width .2s var(--ease),opacity .2s,margin .2s}
.vsl:focus{box-shadow:none;border:0}
.vc:hover .vsl,.vc:focus-within .vsl{width:84px;opacity:1;margin:0 .2rem 0 .7rem}
@media(hover:none){.vc .vsl{width:84px;opacity:1;margin:0 .2rem 0 .7rem}}
.vsl::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.vsl::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
.rtop{position:absolute;top:28px;right:14px;z-index:2;display:flex;align-items:center;gap:.5rem}.rtop .mute,.rtop .vc{position:static}
.sh .vc{position:static;background:rgba(255,255,255,.12)}.sh .vc .vb{margin:0}
.pp{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:2}.paused>.pp{display:grid}.pp svg{box-sizing:content-box;padding:22px 22px 22px 26px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;fill:#fff;backdrop-filter:blur(4px);animation:zoomIn .22s var(--ease)}
.tm{position:absolute;left:40%;width:20%;top:60px;bottom:70px;z-index:1}
.ra{position:absolute;right:-64px;bottom:20px;display:flex;flex-direction:column;gap:1.1rem;align-items:center}
.ra .ab{flex-direction:column;gap:.15rem;font-size:.8rem}
.ri{position:absolute;left:0;right:0;bottom:14px;padding:3rem 1rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.75));border-radius:0 0 14px 14px;color:#fff;pointer-events:none}
.ri *{pointer-events:auto}.ri p{margin:.4rem 0 0}.ri b{cursor:pointer}
@media(max-width:560px){.reel{padding:0}.reel video,.ri{border-radius:0}.ra{right:10px;bottom:90px;color:#fff;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}.reels,.reel{height:calc(100vh - 56px)}}
@media(max-width:760px){.reels,.reel{height:calc(100vh - 56px)}}

/* ---------- perfil ---------- */
.prof{max-width:935px;margin:0 auto;padding:2rem 1rem 5rem}
.pt{display:flex;gap:4rem;align-items:flex-start;padding:0 1rem}
.pt .pav{flex:none}.pt .pi{display:grid;gap:.9rem;min-width:0;flex:1}
.pt h2{margin:0;font-size:1.25rem}.cnt{display:flex;gap:2rem}
.bio{line-height:1.45}.bio p{margin:.15rem 0;white-space:pre-wrap}
.pbt{display:flex;gap:.5rem;margin:1.4rem 0 0}.pbt button{flex:1;padding:.7rem;border-radius:10px}
.hl{display:flex;gap:1.4rem;padding:1.6rem 1rem 1.2rem}.hl button{display:grid;justify-items:center;gap:.4rem;font-weight:600;font-size:.8rem}
.hl .nw{width:86px;height:86px;border-radius:50%;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;color:var(--mute);transition:transform .2s var(--ease),border-color .2s}.hl button:hover .nw{transform:scale(1.06);border-color:var(--mute)}
.pav{position:relative;flex:none}.pavring{padding:4px;border-radius:50%;background:var(--g);display:grid;cursor:pointer;transition:transform .2s var(--ease)}.pavring:hover{transform:scale(1.03)}.pavring.seen{background:#5a606c}.pavring .av{border:4px solid var(--bg)}
.hlthumb{width:86px;height:86px;border-radius:50%;overflow:hidden;background:#000;display:grid;place-items:center}.hlthumb img,.hlthumb video{width:100%;height:100%;object-fit:cover;display:block}.hl .ring .hlthumb{border:3px solid var(--bg)}.hl .ring{cursor:pointer}
.tabs{position:relative;display:flex;justify-content:center;border-top:1px solid var(--line);margin-top:.6rem}
.tab{display:flex;align-items:center;gap:.5rem;padding:1rem 1.6rem;color:var(--mute);font-weight:700;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase}
.tab:hover{color:var(--ink)}.tab.on{color:var(--ink)}
.ink{position:absolute;top:-1px;height:2px;background:var(--ink);width:0;transition:left .35s var(--ease),width .35s var(--ease)}
.tc{min-height:260px;padding-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gi{position:relative;aspect-ratio:1;cursor:pointer;background:var(--soft);overflow:hidden}
.gi.tall{aspect-ratio:9/14}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.gi:hover img,.gi:hover video{transform:scale(1.06)}
.gi>i{position:absolute;top:8px;right:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.gi .ov2{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;gap:1.2rem;align-items:center;justify-content:center;font-weight:700;color:#fff;opacity:0;transition:opacity .2s}
.gi:hover .ov2{opacity:1}.gi .ov2 span{display:flex;gap:.35rem;align-items:center}
.eg{text-align:center;padding:3.5rem 1rem 2rem;display:grid;justify-items:center;gap:.7rem;animation:rise .4s var(--ease)}
.eg .circ{width:62px;height:62px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.eg h3{margin:.3rem 0 0;font-size:1.9rem;font-weight:800}.eg p{margin:0;max-width:340px}
.song{display:inline-flex;align-items:center;gap:.6rem;background:var(--soft);border-radius:20px;padding:.3rem .9rem .3rem .3rem;margin:.4rem 0}
.song button{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg)}.song img,.sa{width:32px;height:32px;border-radius:6px}.song>span:not(.av),.rq>span:not(.av){display:grid;line-height:1.15}
/* seleção do trecho da música da bio */
.seg{margin:.6rem 0;padding:.7rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.segtrack{position:relative;height:6px;border-radius:4px;background:var(--soft2);overflow:hidden;margin:.6rem 0 .35rem}
.segtrack i{position:absolute;top:0;bottom:0;background:var(--blue);border-radius:4px;transition:left .08s linear,width .08s linear}
.seg input[type=range]{display:block;margin:.15rem 0;padding:0;border:0;background:none;box-shadow:none;accent-color:var(--blue);height:16px}
.seg input[type=range]:focus{box-shadow:none;border:0}

/* Novo design do player de áudio no DM (estilo azul da Image 2) */
.audio-bubble{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;background:#4c5fff;color:#fff;border-radius:16px;padding:.7rem 1rem;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.audio-player{display:flex;align-items:center;gap:.8rem;width:100%}
.audio-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.audio-progress{flex:1;height:4px;background:rgba(255,255,255,.4);border-radius:2px;position:relative;cursor:pointer}
.audio-progress-fill{height:100%;background:#fff;border-radius:2px;width:0%}
.audio-dots{display:flex;gap:1px;flex:1;height:4px}
.audio-dot{width:2px;height:4px;background:rgba(255,255,255,.6);border-radius:1px}
.audio-time{font-size:.75rem;min-width:32px;text-align:right}
.audio-transcript{font-size:.72rem;color:rgba(255,255,255,.9);cursor:pointer;padding-top:.1rem}
.dm-menu-item{width:100%;padding:.6rem 1rem;background:none;border:none;color:var(--ink);font-size:.9rem;cursor:pointer;text-align:left}
.dm-menu-item:hover{background:rgba(255,255,255,.05)}
.dm-menu-del{color:var(--red)}

async function api(url, o = {}) {
  o.headers = { ...(o.headers || {}), Authorization: 'Bearer ' + token };
  if (o.json) { o.body = JSON.stringify(o.json); o.headers['Content-Type'] = 'application/json'; o.method = o.method || 'POST'; }
  const r = await fetch(url, o);
  const raw = await r.text();
  let d = {};
  if (raw) {
    try { d = JSON.parse(raw); }
    catch {
      // Servidores/rotas que devolvem HTML (ex.: página 404) não podem quebrar o app com "Unexpected token '<'".
      if (r.status === 404) throw new Error('Recurso não encontrado no servidor.');
      throw new Error(r.ok ? 'Resposta inválida do servidor.' : 'O servidor não conseguiu concluir a ação.');
    }
  }
  if (r.status === 401 && token) logout();
  if (!r.ok) throw new Error(d.error || 'Algo deu errado.');
  return d;
}

function getSavedAccounts() {
  try { return JSON.parse(localStorage.getItem('anarchy_accounts') || '[]'); } catch { return []; }
}
function saveAccount(tokenVal, usernameVal, nameVal, avatarVal, verifiedVal) {
  const accounts = getSavedAccounts();
  const existing = accounts.find(a => a.username === usernameVal);
  const account = { token: tokenVal, username: usernameVal, name: nameVal, avatar: avatarVal, verified: verifiedVal, lastUsed: Date.now() };
  if (existing) Object.assign(existing, account);
  else accounts.push(account);
  localStorage.setItem('anarchy_accounts', JSON.stringify(accounts));
}
function removeAccount(usernameVal) {
  const accounts = getSavedAccounts().filter(a => a.username !== usernameVal);
  localStorage.setItem('anarchy_accounts', JSON.stringify(accounts));
  if (localStorage.getItem('anarchy_current') === usernameVal) localStorage.removeItem('anarchy_current');
}
function switchAccount(usernameVal) {
  const accounts = getSavedAccounts();
  const acc = accounts.find(a => a.username === usernameVal);
  if (acc) {
    localStorage.setItem('token', acc.token);
    localStorage.setItem('anarchy_current', acc.username);
    location.reload();
  }
}

function ask(msg, yes = 'Sim', no = 'Voltar') {
  return new Promise((resolve) => {
    const d = document.createElement('div'); d.id = 'ask'; d.className = 'ov';
    d.innerHTML = `<div class="box askb" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="gh" data-a="0">${esc(no)}</button><button class="bl dg" data-a="1">${esc(yes)}</button></div></div>`;
    document.body.appendChild(d);
    const yesBtn = d.querySelector('.dg'); yesBtn.focus();
    let done = false;
    const end = (v) => { if (done) return; done = true; document.removeEventListener('keydown', key, true); d.classList.add('out'); setTimeout(() => d.remove(), 200); resolve(v); };
    const key = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); end(false); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); end(document.activeElement === d.querySelector('.gh') ? false : true); }
      else if (e.key === 'Tab') { e.preventDefault(); const bs = [...d.querySelectorAll('button')], i = bs.indexOf(document.activeElement); bs[(i + 1) % bs.length].focus(); }
      else e.stopPropagation();
    };
    document.addEventListener('keydown', key, true);
    d.onmousedown = (e) => { if (e.target === d) end(false); };
    d.querySelectorAll('button').forEach((b) => { b.onclick = () => end(b.dataset.a === '1'); });
  });
}

    const end = (v) => { if (done) return; done = true; document.removeEventListener('keydown', key, true); d.classList.add('out'); setTimeout(() => d.remove(), 200); resolve(v); };
    const key = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); end(null); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); end(input.value); }
      else if (e.key === 'Tab') { e.preventDefault(); const bs = [...d.querySelectorAll('button')], i = bs.indexOf(document.activeElement); bs[(i + 1) % bs.length].focus(); }

    d.querySelectorAll('button').forEach((b) => { b.onclick = () => end(b.dataset.a === '1' ? input.value : null); });
  });
}

/* ---------- Avatar Cropper ---------- */
const AC = { file: null, img: null, x: 0, y: 0, scale: 1, rotating: false };

function openAvatarCropper(input) {
  const f = input.files[0]; if (!f) return;
  AC.file = f;
  const url = URL.createObjectURL(f);
  AC.img = new Image(); AC.img.src = url;
  AC.img.onload = () => { AC.x = 0; AC.y = 0; AC.scale = 1; renderCropper(); };
}

function renderCropper() {
  const html = `<div class="ov" id="cropperOverlay" style="display:flex;align-items:center;justify-content:center">
    <div style="background:var(--soft);border-radius:16px;padding:1rem;max-width:90vw;max-height:90vh;overflow:auto;display:flex;flex-direction:column;align-items:center">
      <div style="margin-bottom:.7rem"><h3 style="margin:0 0 .3rem">Ajustar foto de perfil</h3><small style="color:var(--mute)">Arraste para posicionar • Role para zoom</small></div>
      <div style="position:relative;width:200px;height:200px;border-radius:50%;overflow:hidden;border:3px solid var(--line);box-shadow:0 0 20px rgba(255,45,45,.4);cursor:grab">
        <img id="cropImg" src="${AC.img.src}" style="position:absolute;top:${AC.y}px;left:${AC.x}px;transform:scale(${AC.scale});transform-origin:center;max-width:none;cursor:grab;user-select:none">
      </div>
      <div style="display:flex;gap:.5rem;margin:.5rem 0">
        <button class="gh" onclick="AC.scale=Math.max(.5,AC.scale-.1);renderCropper()">−</button>
        <button class="bl" onclick="AC.scale=Math.min(3,AC.scale+.1);renderCropper()">+</button>
      </div>
      <div class="row" style="margin-top:.5rem">
        <button class="gh" onclick="closeCropper()">Cancelar</button>
        <button class="bl" onclick="applyAvatarCrop()">Aplicar</button>
      </div>
    </div>
  </div>`;
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  document.body.appendChild(tmp.firstElementChild);
  const cImg = document.getElementById('cropImg');
  const container = cImg.parentElement;
  let isDragging = false, startX = 0, startY = 0, startCX = 0, startCY = 0;
  
  const startDrag = (e) => {
    isDragging = true;
    startX = e.clientX || (e.touches && e.touches[0].clientX);
    startY = e.clientY || (e.touches && e.touches[0].clientY);
    startCX = AC.x;
    startCY = AC.y;
    container.style.cursor = 'grabbing';
    cImg.style.cursor = 'grabbing';
    e.preventDefault();
  };
  
  const doDrag = (e) => {
    if (!isDragging) return;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    AC.x = startCX + (clientX - startX);
    AC.y = startCY + (clientY - startY);
    cImg.style.left = AC.x + 'px';
    cImg.style.top = AC.y + 'px';
    e.preventDefault();
  };
  
  const endDrag = () => {
    isDragging = false;
    container.style.cursor = 'grab';
    cImg.style.cursor = 'grab';
  };

  cImg.addEventListener('mousedown', startDrag);
  cImg.addEventListener('touchstart', startDrag, { passive: false });
  cImg.addEventListener('mousemove', doDrag);
  cImg.addEventListener('touchmove', doDrag, { passive: false });
  cImg.addEventListener('mouseup', endDrag);
  cImg.addEventListener('touchend', endDrag);
  cImg.addEventListener('mouseleave', endDrag);
  cImg.addEventListener('wheel', e => { e.preventDefault(); const zoom = e.deltaY > 0 ? .9 : 1.1; AC.scale = Math.min(3, Math.max(.5, AC.scale * zoom)); cImg.style.transform = `scale(${AC.scale})`; }, { passive: false });
}

function closeCropper() {
  const el = document.getElementById('cropperOverlay'); if (el) el.remove();
  AC.file = null; AC.img = null;
}

function applyAvatarCrop() {
  const cImg = document.getElementById('cropImg'); if (!cImg || !AC.file) return;
  const canvas = document.createElement('canvas'); canvas.width = 200; canvas.height = 200;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 200, 200);
  const drawScale = 200 / AC.scale;
  const drawX = -AC.x / AC.scale;
  const drawY = -AC.y / AC.scale;
  ctx.drawImage(AC.img, drawX, drawY, AC.img.width / AC.scale, AC.img.height / AC.scale, drawX, drawY, AC.img.width / AC.scale, AC.img.height / AC.scale);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.beginPath(); ctx.arc(100, 100, 100, 0, Math.PI * 2); ctx.fill();
  const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
  closeCropper();
  const input = document.getElementById('ea');
  const blob = dataURLtoBlob(croppedDataUrl);
  const file = new File([blob], AC.file.name, { type: 'image/jpeg', lastModified: Date.now() });
  const dt = new DataTransfer(); dt.items.add(file);
  input.files = dt.files;
  const preview = document.getElementById('eaPreview'); if (preview) preview.innerHTML = `<img src="${croppedDataUrl}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--blue)">`;
  toast('Foto ajustada');
}

function dataURLtoBlob(dataurl) {
  const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1], bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

const vio = new IntersectionObserver((es) => es.forEach((e) => {
  const v = e.target;
  if (e.isIntersecting && e.intersectionRatio >= .6 && !$('m')) { v.muted = muted; v.volume = vol; v.play().catch(() => v.parentNode.classList.add('paused')); } else autoPause(v);
}), { threshold: [0, .6, 1] });

function togglePlay(v) { v.paused ? v.play().catch(() => {}) : v.pause(); }
const vpPlay = (v) => v.parentNode.classList.remove('paused');
const vpPause = (v) => { if (v._auto) v._auto = false; else v.parentNode.classList.add('paused'); };
const autoPause = (v) => { if (!v.paused) { v._auto = true; v.pause(); } };
/* ---------- volume (feed, reels e stories) ---------- */
let vol = 1, smuted = false, stManual = false;
try { const x = parseFloat(localStorage.vol); if (x >= 0 && x <= 1) vol = x; } catch {}
const isMuted = (k) => (k === 'story' ? smuted : muted) || vol === 0;
const volIcon = (k) => I(isMuted(k) ? 'voloff' : 'volon', 16);
const volCtl = (k) => `<div class="vc" data-vk="${k}" onclick="event.stopPropagation()"><input class="vsl" type="range" min="0" max="1" step="0.01" value="${isMuted(k) ? 0 : vol}" style="--p:${isMuted(k) ? 0 : vol * 100}%" oninput="setVol(this.value,'${k}')" aria-label="Volume"><button class="vb" onclick="toggleMute('${k}')" aria-label="Som">${volIcon(k)}</button></div>`;
function applyVol() {
  document.querySelectorAll('video[data-auto]').forEach((v) => { v.muted = muted; v.volume = vol; });
  const sv = document.querySelector('#sv video.sm'); if (sv) { sv.muted = smuted; sv.volume = vol; }
  document.querySelectorAll('.vc').forEach((c) => {
    const k = c.dataset.vk, sl = c.querySelector('.vsl');
    sl.value = isMuted(k) ? 0 : vol; sl.style.setProperty('--p', (isMuted(k) ? 0 : vol * 100) + '%');
    c.querySelector('.vb').innerHTML = volIcon(k);
  });
}
function setVol(x, k) {
  x = +x;
  if (x <= 0) { if (k === 'story') smuted = true; else muted = true; }

/* ---------- Cropper de mídia do post/story ---------- */
function pcRatio() {
  if (!PC.img) return 1;
  if (PC.ratioKey === 'orig') return PC.img.width / PC.img.height;
  return PC.ratioKey;
}
function pcViewport() {
  const ratio = pcRatio();
  let W = 320, H = W / ratio;
  if (H > 420) { H = 420; W = H * ratio; }
  if (W > 420) { W = 420; H = W / ratio; }
  return { W: Math.max(90, Math.round(W)), H: Math.max(90, Math.round(H)) };
}
function pcClamp() {
  if (!PC.img) return;
  const { W, H } = pcViewport();
  const s = Math.max(W / PC.img.width, H / PC.img.height) * PC.zoom;
  const dw = PC.img.width * s, dh = PC.img.height * s;
  const mx = Math.max(0, (dw - W) / 2), my = Math.max(0, (dh - H) / 2);
  PC.x = Math.max(-mx, Math.min(mx, PC.x));
  PC.y = Math.max(-my, Math.min(my, PC.y));
}
function pcPaint() {
  const img = $('pcImg'), view = $('pcView'); if (!img || !PC.img) return;
  pcClamp();
  const { W, H } = pcViewport();
  const s = Math.max(W / PC.img.width, H / PC.img.height) * PC.zoom;
  const dw = PC.img.width * s, dh = PC.img.height * s;
  img.style.width = dw + 'px'; img.style.height = dh + 'px';
  img.style.left = ((W - dw) / 2 + PC.x) + 'px';
  img.style.top = ((H - dh) / 2 + PC.y) + 'px';
}
function openPostCropper() {
  if (!PM.orig) return toast('Escolha uma imagem primeiro.');
  if (!/^image\//.test(PM.orig.type)) return toast('Só é possível recortar imagens.');
  if (PC.url) URL.revokeObjectURL(PC.url);
  PC.img = new Image();
  PC.url = URL.createObjectURL(PM.orig);
  PC.ratioKey = 'orig'; PC.x = 0; PC.y = 0; PC.zoom = 1;
  PC.img.onload = () => renderPostCropper();
  PC.img.src = PC.url;
}
function renderPostCropper() {
  const old = $('pcOverlay'); if (old) old.remove();
  const { W, H } = pcViewport();
  const d = document.createElement('div'); d.id = 'pcOverlay';

function closePostCropper() {

function applyPostCrop() {
  if (!PC.img || !PM.orig) return;
  const { W, H } = pcViewport();
  const s = Math.max(W / PC.img.width, H / PC.img.height) * PC.zoom;
  const sw = W / s, sh = H / s;
  let sx = PC.img.width / 2 - sw / 2 - PC.x / s;
  let sy = PC.img.height / 2 - sh / 2 - PC.y / s;
  sx = Math.max(0, Math.min(PC.img.width - sw, sx));
  sy = Math.max(0, Math.min(PC.img.height - sh, sy));
  let outW = Math.max(1, Math.round(sw)), outH = Math.max(1, Math.round(sh));
  if (outW > 1440) { outH = Math.round(outH * 1440 / outW); outW = 1440; }

  const ctx = canvas.getContext('2d');

  ctx.drawImage(PC.img, sx, sy, sw, sh, 0, 0, outW, outH);
  canvas.toBlob((blob) => {
    if (!blob) return toast('Não foi possível recortar esta imagem.');
    const name = 'recorte-' + Date.now() + '.jpg';
    PM.file = new File([blob], name, { type: 'image/jpeg', lastModified: Date.now() });
    PM.recrop = true;
    closePostCropper();

// ---- relógio do story: imagem = 20 s; vídeo = acompanha o tempo real do vídeo ----
const STORY_MS = 20000;

  stopClock();
  const c = stClock = { vid, elapsed: 0, last: performance.now(), paused: false, onEnd };
  const tick = (now) => {
    if (stClock !== c) return;
    let p;
    if (vid) p = vid.duration ? vid.currentTime / vid.duration : 0;
    else { if (!c.paused) c.elapsed += now - c.last; p = c.elapsed / STORY_MS; }
    c.last = now;
    const b = $('sb'); if (b) b.style.transform = `scaleX(${Math.min(1, p)})`;
    if (!vid && p >= 1) { stopClock(); return onEnd(); }
    stRaf = requestAnimationFrame(tick);
  };
  stRaf = requestAnimationFrame(tick);
}

function playSong(b) {
  const s = b.dataset.src, start = Math.max(0, +b.dataset.start || 0), dur = Math.max(0, +b.dataset.dur || 0);
  if (au && au._src === s && !au.paused) { au.pause(); b.textContent = '▶'; return; }
  if (au) au.pause();
  dmStopAll();
  document.querySelectorAll('.song button').forEach((x) => { x.textContent = '▶'; });
  au = new Audio(s); au._src = s;
  const end = dur > 0 ? start + dur : 0;
  au.addEventListener('loadedmetadata', () => {
    if (start && au.duration) au.currentTime = Math.min(start, Math.max(0, au.duration - 0.5));
  });
  au.ontimeupdate = () => { if (end && au.currentTime >= end) { au.pause(); b.textContent = '▶'; } };
  au.onended = () => { b.textContent = '▶'; };
  au.play().catch(() => toast('Não foi possível tocar a prévia.'));
  b.textContent = '❚❚';
}
function playSongPost(src, pid) {
  if (au && au._src === src && !au.paused) { au.pause(); return; }
  if (au) au.pause();
  dmStopAll();
  document.querySelectorAll('.song button').forEach((x) => { x.textContent = '▶'; });
  au = new Audio(src); au._src = src;
  au.play();
  const btn = document.querySelector(`[data-pa="${pid}"] button`);
  if (btn) btn.textContent = '❚❚';
  let slider = document.querySelector('#song-slider-' + pid);
  if (!slider) {
    slider = document.createElement('input');
    slider.type = 'range';
    slider.id = 'song-slider-' + pid;
    slider.style = 'width:120px;margin-top:4px;accent-color:var(--blue)';
    const wrapper = document.querySelector(`[data-pa="${pid}"]`) || document.querySelector(`[data-pl="${pid}"]`);
    if (wrapper) wrapper.parentNode.insertBefore(slider, wrapper.nextSibling);
  }
  au.onloadedmetadata = () => { slider.max = Math.floor(au.duration || 30); };
  au.ontimeupdate = () => { slider.value = Math.floor(au.currentTime); };
  slider.oninput = () => { au.currentTime = slider.value; };
  au.onended = () => { if (btn) btn.textContent = '▶'; slider.value = 0; };
}

const fmtSeg = (s) => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function updateSeg() {
  const a = $('sgA'), b = $('sgB'), fill = $('sgfill'), lbl = $('sglbl');
  if (!a || !b || !fill || !lbl) return;
  const max = +a.max || 30;
  let x = +a.value, y = +b.value;
  if (y < x + 3) { if (document.activeElement === a) y = Math.min(max, x + 3); else x = Math.max(0, y - 3); a.value = x; b.value = y; }
  fill.style.left = (x / max * 100) + '%'; fill.style.width = ((y - x) / max * 100) + '%';
  lbl.textContent = fmtSeg(x) + ' – ' + fmtSeg(y) + ' (' + Math.round(y - x) + 's)';
}
function initSegEditor() {
  const w = $('sgw'); if (!w) return;
  if (!song.song_url) { w.innerHTML = ''; return; }
  w.innerHTML = `<div class="seg">
    <div class="row" style="justify-content:space-between"><b style="font-size:.8rem">Trecho que toca no perfil</b><small id="sglbl">0:00 – 0:30</small></div>
    <div class="segtrack"><i id="sgfill"></i></div>
    <input type="range" id="sgA" min="0" max="30" step="1" value="0" aria-label="Início do trecho">
    <input type="range" id="sgB" min="0" max="30" step="1" value="30" aria-label="Fim do trecho">
    <div class="row" style="margin-top:.4rem"><button type="button" class="gh" onclick="previewSeg()">▶ Ouvir trecho</button><small>Deslize para escolher início e fim.</small></div>
  </div>`;
  const a = $('sgA'), b = $('sgB');
  a.oninput = updateSeg; b.oninput = updateSeg;
  const probe = new Audio(song.song_url);
  let done = false;
  const ready = () => {
    if (done) return;
    done = true;
    const full = Math.max(5, Math.min(600, Math.floor(probe.duration || 30)));
    a.max = full; b.max = full;
    const st = Math.min(Math.max(0, +song.song_start || 0), Math.max(0, full - 3));
    const du = Math.max(3, Math.min(full - st, +song.song_dur || Math.min(30, full)));
    a.value = st; b.value = Math.min(full, st + du);
    updateSeg();
  };
  probe.addEventListener('loadedmetadata', ready);
  probe.addEventListener('error', ready);
  setTimeout(() => { if (!probe.duration) ready(); }, 1500);
}
function previewSeg() {
  const a = $('sgA'), b = $('sgB');

}

// ---- Editar/Excluir Comentário ----
// edição na própria linha: troca o texto por um campo; Enter salva, Esc (ou clicar fora) cancela
function inlineEdit(textEl, current, save, cancel, line = 'var(--blue)') {
  const inp = document.createElement('input');
  inp.value = current; inp.maxLength = 300; inp.autocomplete = 'off';
  inp.style.cssText = `display:inline-block;width:min(100%,260px);min-width:120px;padding:.1rem .3rem;margin:0;border:0;border-bottom:1px solid ${line};border-radius:0;background:transparent;box-shadow:none;font:inherit;color:inherit;outline:0`;
  textEl.style.display = 'none'; textEl.after(inp); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  let done = false;
  const end = (fn) => { if (done) return; done = true; fn(); };
  inp.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); const t = inp.value.trim(); if (!t || t === current.trim()) end(cancel); else end(() => save(t)); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); end(cancel); }
  };
  inp.onblur = () => setTimeout(() => end(cancel), 120);
  return inp;
}

}

// ---- Enviar mídia na DM (sem duplicar: o servidor devolve o eco com o ID real) ----
async function pickDMFile() {
  if (!peer) return toast('Selecione uma conversa.');
  const chat = { id: peer.id, name: peer.name };
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,video/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (!(await ask(`Enviar "${f.name}" para @${chat.name}?`, 'Enviar', 'Cancelar'))) { input.remove(); return; }
    const fd = new FormData(); fd.append('media', f);
    try {
      const r = await fetch('/api/dm/media', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd });
      let d = {};
      try { d = await r.json(); } catch {}
      if (!r.ok || !d.url) throw new Error(d.error || 'Falha ao enviar mídia.');
      if (!sock || !sock.connected) throw new Error('Sem conexão. Verifique sua internet.');
      sock.emit('msg', { to: chat.id, media: d.url, media_type: d.type });
      toast('Mídia enviada');
    } catch (err) { toast(err.message); }
    finally { input.remove(); }
  };
  input.click();
}

async function pickDMAudio() {
  if (!peer) return toast('Selecione uma conversa.');
  const chat = { id: peer.id, name: peer.name };
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*,.mp3,.m4a,.m4b,.aac,.wav,.ogg,.oga,.opus,.weba,.flac,.amr,.wma,.aiff,.aif,.au,.mid,.midi,.3gp,.3g2,.caf,.mka,.mp2,.mpga';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (!(await ask(`Enviar "${f.name}" para @${chat.name}?`, 'Enviar', 'Cancelar'))) { input.remove(); return; }
    const fd = new FormData(); fd.append('media', f);
    try {
      const r = await fetch('/api/dm/media', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd });
      let d = {};
      try { d = await r.json(); } catch {}
      if (!r.ok || !d.url) throw new Error(d.error || 'Falha ao enviar áudio.');
      if (d.type !== 'audio') throw new Error('Escolha um arquivo de áudio.');
      if (!sock || !sock.connected) throw new Error('Sem conexão. Verifique sua internet.');
      const text = $('mt') ? $('mt').value.trim() : '';
      sock.emit('msg', { to: chat.id, media: d.url, media_type: 'audio', text });
      if ($('mt')) $('mt').value = '';
      toast('Nota de áudio enviada');
    } catch (err) { toast(err.message); }
    finally { input.remove(); }
  };
  input.click();
}

// ---- Player de áudio das mensagens da DM ----
function dmTime(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function dmReset() {
  dmAudios.forEach((a) => { try { a.pause(); } catch {} });
  dmAudios.clear(); dmSrc.clear();
  if (au && !au.paused) au.pause();
}
function dmStopAll(except) {
  dmAudios.forEach((a, id) => {
    if (id === except) return;
    if (!a.paused) a.pause();
    const b = document.querySelector(`[data-play="${id}"]`);
    if (b) b.textContent = '▶';
  });
  if (au && !au.paused) au.pause();
}
function dmAudioFor(id) {
  let a = dmAudios.get(id);
  if (a) return a;
  const url = dmSrc.get(id);
  if (!url) return null;
  a = new Audio(url);
  a.preload = 'metadata';
  dmAudios.set(id, a);
  a.addEventListener('loadedmetadata', () => {
    const t = document.querySelector(`[data-time="${id}"]`);
    if (t) t.textContent = dmTime(a.duration);
  });
  a.addEventListener('timeupdate', () => {
    const bar = document.querySelector(`[data-bar="${id}"] i`);
    if (bar) bar.style.width = ((a.currentTime / (a.duration || 1)) * 100) + '%';
    const t = document.querySelector(`[data-time="${id}"]`);
    if (t) t.textContent = dmTime(a.currentTime);
  });
  a.addEventListener('ended', () => {
    const b = document.querySelector(`[data-play="${id}"]`); if (b) b.textContent = '▶';
    const bar = document.querySelector(`[data-bar="${id}"] i`); if (bar) bar.style.width = '0%';
    const t = document.querySelector(`[data-time="${id}"]`); if (t) t.textContent = dmTime(a.duration);
  });
  a.addEventListener('error', () => { if (a.dataset.userstarted) toast('Este formato de áudio não é suportado por este navegador.'); });
  return a;
}
function toggleDmAudio(id) {
  const a = dmAudioFor(id);
  if (!a) return;
  a.dataset.userstarted = '1';
  const b = document.querySelector(`[data-play="${id}"]`);
  if (a.paused) {
    dmStopAll(id);
    a.play().then(() => { if (b) b.textContent = '❚❚'; }).catch(() => toast('Não foi possível tocar este áudio.'));
  } else {
    a.pause();
    if (b) b.textContent = '▶';
  }
}
function seekDmAudio(e, id) {
  const a = dmAudioFor(id);
  if (!a || !a.duration || !isFinite(a.duration)) return;
  const r = e.currentTarget.getBoundingClientRect();
  if (!r.width) return;
  a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * a.duration;
}
